<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 단어장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE6D4;
    --paper-line:#DCD2B4;
    --card:#FFFCF5;
    --ink:#2A2E3A;
    --ink-soft:#736B58;
    --ink-faint:#A79E88;
    --gold:#B98A2C;
    --gold-deep:#8F6A1E;
    --green:#5F7A5D;
    --green-bg:#E4EBDF;
    --red:#A8433A;
    --red-bg:#F3E3DF;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    font-family:'Noto Sans KR', sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:24px 14px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;}

  .eyebrow{
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink-faint); font-weight:700; margin-bottom:6px;
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{content:''; width:16px; height:1px; background:var(--ink-faint);}
  h1{
    font-family:'Noto Serif KR', serif; font-weight:900;
    font-size:25px; margin:0 0 14px; letter-spacing:-.01em;
  }
  h1 span{color:var(--gold);}

  .account-row{
    display:flex; align-items:center; justify-content:space-between;
    margin:-6px 0 16px; font-size:12px; color:var(--ink-faint);
  }
  .account-row .email{font-weight:700; color:var(--ink-soft);}
  .link-btn{
    border:none; background:none; color:var(--ink-faint); font-size:12px;
    text-decoration:underline; cursor:pointer; font-family:'Noto Sans KR';
  }

  /* ---- Page tabs (binder-divider style) ---- */
  .page-tabs{
    display:flex; align-items:flex-end; gap:4px; overflow-x:auto;
    padding:0 2px; scrollbar-width:none; margin-bottom:0;
  }
  .page-tabs::-webkit-scrollbar{display:none;}
  .page-tab{
    flex:0 0 auto; position:relative; padding:9px 16px 8px; cursor:pointer;
    font-family:'Noto Serif KR'; font-weight:700; font-size:13px;
    color:var(--ink-soft); background:#E1D8BE; border-radius:10px 10px 0 0;
    white-space:nowrap; border:1px solid var(--paper-line); border-bottom:none;
    transition:background .15s, color .15s;
  }
  .page-tab.active{background:var(--card); color:var(--ink); z-index:2;}
  .page-tab.fav-tab{color:var(--gold-deep);}
  .page-tab.fav-tab.active{background:var(--card); color:var(--gold-deep);}
  .page-tab.review-tab{color:var(--green);}
  .page-tab.review-tab.active{background:var(--card); color:var(--green);}
  .page-tab .cnt{font-weight:500; color:inherit; opacity:.6; margin-left:4px; font-family:'Noto Sans KR'; font-size:11px;}
  .page-tab-add{
    flex:0 0 auto; width:32px; height:32px; align-self:center; border-radius:50%;
    border:1px dashed var(--ink-faint); background:transparent; color:var(--ink-faint);
    font-size:16px; cursor:pointer; margin-left:4px;
  }

  .sheet{
    background:var(--card); border:1px solid var(--paper-line); border-radius:0 12px 12px 12px;
    box-shadow:0 1px 2px rgba(0,0,0,.06), 0 10px 24px -14px rgba(42,46,58,.28);
    overflow:hidden; margin-bottom:20px;
  }
  .sheet-toolbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px; border-bottom:1px solid var(--paper-line); gap:10px;
  }
  .sheet-toolbar .title-edit{
    font-family:'Noto Serif KR'; font-weight:700; font-size:15px; color:var(--ink);
    background:transparent; border:none; outline:none; max-width:220px;
  }
  .toolbar-btns{display:flex; gap:6px;}
  .icon-btn{
    border:none; background:rgba(0,0,0,.05); color:var(--ink-soft); width:28px; height:28px;
    border-radius:7px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:13px;
  }
  .icon-btn:hover{background:rgba(0,0,0,.09);}
  .icon-btn.danger:hover{background:var(--red-bg); color:var(--red);}

  .search-row{padding:9px 14px; border-bottom:1px solid var(--paper-line);}
  .search-row input{
    width:100%; border:1px solid var(--paper-line); border-radius:8px; padding:8px 12px;
    font-family:'Noto Sans KR'; font-size:13.5px; outline:none; background:#fff; color:var(--ink);
  }
  .search-row input:focus{border-color:var(--gold);}
  .search-row input::placeholder{color:var(--ink-faint);}

  table.voca-table{ width:100%; border-collapse:collapse; }
  .voca-table thead th{
    text-align:left; font-size:11.5px; font-weight:700; color:var(--ink-faint);
    text-transform:uppercase; letter-spacing:.06em; padding:9px 14px; border-bottom:1px solid var(--paper-line);
  }
  .voca-table thead th.col-word{width:34%; border-right:1px solid var(--paper-line);}
  .voca-table tbody td{
    padding:10px 14px; border-bottom:1px solid var(--paper-line); vertical-align:top;
    font-size:14px; line-height:1.55;
  }
  .voca-table tbody tr:last-child td{border-bottom:none;}
  .voca-table tbody tr:hover{background:rgba(185,138,44,0.045);}
  td.col-word{border-right:1px solid var(--paper-line);}
  .word-cell{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .word-text{
    font-family:'Noto Serif KR'; font-weight:700; font-size:15.5px; color:var(--ink);
    background:transparent; border:none; outline:none; width:auto; min-width:40px; max-width:120px;
  }
  .row-icon{
    border:none; background:transparent; cursor:pointer; width:24px; height:24px; border-radius:6px;
    display:flex; align-items:center; justify-content:center; color:var(--ink-faint); flex:0 0 auto;
  }
  .row-icon:hover{background:rgba(0,0,0,.06); color:var(--ink);}
  .row-icon.star.active{color:var(--gold);}
  .row-icon svg{width:15px; height:15px;}
  .row-icon.speak.loading{opacity:.4; animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:.4;} 50%{opacity:.9;}}

  .meaning-cell{position:relative;}
  .meaning-text{
    width:100%; border:none; outline:none; background:transparent; resize:none;
    font-family:'Noto Sans KR'; font-size:13.5px; color:var(--ink); line-height:1.6;
    min-height:20px; white-space:pre-wrap;
  }
  .meaning-text::placeholder{color:var(--ink-faint);}
  .meaning-text.pending{color:var(--ink-faint); font-style:italic;}
  .del-btn{opacity:0; transition:opacity .12s;}
  tr:hover .del-btn{opacity:1;}

  .add-row{padding:10px 14px; display:flex; gap:8px; align-items:center;}
  .add-row input{
    flex:1; border:1.5px dashed var(--paper-line); background:transparent; border-radius:8px;
    padding:9px 12px; font-family:'Noto Serif KR'; font-size:14px; color:var(--ink); outline:none;
  }
  .add-row input:focus{border-color:var(--gold); border-style:solid;}

  .empty-state{ text-align:center; padding:44px 20px; color:var(--ink-soft); }
  .empty-state h3{font-family:'Noto Serif KR'; font-size:16px; margin:0 0 6px; color:var(--ink);}
  .empty-state p{font-size:12.5px; margin:0; color:var(--ink-faint);}

  .fav-page-badge{
    display:inline-block; font-size:10px; font-weight:700; color:var(--gold-deep);
    background:#F3E7CE; padding:1px 6px; border-radius:5px; margin-bottom:5px;
  }

  .study-cta{ display:flex; justify-content:flex-end; padding:10px 14px; border-top:1px solid var(--paper-line); }
  .btn{
    border:none; border-radius:9px; padding:10px 16px; font-family:'Noto Sans KR';
    font-weight:700; font-size:13.5px; cursor:pointer; transition:opacity .15s, transform .1s;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--ink); color:var(--card);}
  .btn-ghost{background:rgba(0,0,0,.05); color:var(--ink-soft);}
  .btn:disabled{opacity:.35; cursor:default;}

  .sync-status{ font-size:11px; text-align:right; margin:-10px 2px 12px; min-height:14px; color:var(--ink-faint); }
  .sync-status.error{color:var(--red); font-weight:700;}

  /* ---- Auth ---- */
  .auth-overlay{
    position:fixed; inset:0; background:var(--paper); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .auth-card{
    width:100%; max-width:340px; background:var(--card); border-radius:var(--radius);
    box-shadow:0 10px 24px -12px rgba(42,46,58,.28); padding:30px 26px;
  }
  .auth-card h2{font-family:'Noto Serif KR'; font-size:20px; margin:0 0 4px; color:var(--ink);}
  .auth-card .sub{font-size:12.5px; color:var(--ink-faint); margin:0 0 20px;}
  .auth-field{margin-bottom:12px;}
  .auth-field label{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:5px;}
  .auth-field input{
    width:100%; padding:10px 12px; border-radius:8px; border:1.5px solid var(--paper-line);
    font-family:'Noto Sans KR'; font-size:14px; background:#fff; color:var(--ink); outline:none;
  }
  .auth-field input:focus{border-color:var(--gold);}
  .auth-error{font-size:12.5px; color:var(--red); margin:6px 0 0; min-height:16px;}
  .auth-actions{display:flex; flex-direction:column; gap:8px; margin-top:16px;}
  .auth-actions .btn{width:100%;}
  .auth-toggle{text-align:center; margin-top:14px; font-size:12.5px; color:var(--ink-faint);}

  /* ---- Learn overlay (memorize/spell, reused from ClassCard-style app) ---- */
  .learn-overlay{
    position:fixed; inset:0; background:var(--paper); z-index:60; display:none;
    padding:24px 16px 40px; overflow-y:auto;
  }
  .learn-overlay.open{display:block;}
  .learn-wrap{max-width:420px; margin:0 auto;}
  .learn-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .learn-close{border:none; background:rgba(0,0,0,.06); color:var(--ink-soft); width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:16px;}
  .modes{display:flex; gap:6px; margin-bottom:14px; background:rgba(0,0,0,.04); padding:4px; border-radius:12px;}
  .mode-btn{flex:1; border:none; background:transparent; padding:10px 6px; font-family:'Noto Sans KR'; font-weight:700; font-size:13.5px; color:var(--ink-soft); border-radius:9px; cursor:pointer;}
  .mode-btn.active{background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .progress-row{display:flex; justify-content:space-between; align-items:center; font-size:12.5px; color:var(--ink-soft); margin-bottom:10px; padding:0 2px;}
  .progress-track{flex:1; height:4px; background:var(--paper-line); border-radius:2px; margin:0 12px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--gold); border-radius:2px; transition:width .2s;}
  .stage{position:relative; min-height:320px; margin-bottom:16px;}
  .card{
    position:relative; background:var(--card); border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(0,0,0,.06), 0 10px 24px -12px rgba(42,46,58,.28);
    padding:34px 26px 26px; min-height:320px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; cursor:pointer; user-select:none; border:1px solid rgba(0,0,0,.04);
  }
  .ribbon{
    position:absolute; top:0; right:22px; width:26px; height:44px;
    background:var(--ink-faint); clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);
    cursor:pointer; z-index:2;
  }
  .ribbon.starred{background:var(--gold);}
  .ribbon svg{position:absolute; top:8px; left:5px; width:16px; height:16px;}
  .word{font-family:'Noto Serif KR'; font-weight:900; font-size:32px; color:var(--ink); word-break:break-word; margin-bottom:6px;}
  .word-row{display:flex; align-items:center; justify-content:center; gap:10px;}
  .speak-btn{
    border:none; background:var(--paper); color:var(--gold-deep); cursor:pointer;
    width:34px; height:34px; border-radius:50%; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
  }
  .speak-btn.small{width:28px; height:28px;}
  .speak-btn.small svg{width:14px; height:14px;}
  .speak-btn svg{width:17px; height:17px;}
  .speak-btn.loading{opacity:.45; animation:pulse 1s infinite;}
  .tap-cue{font-size:12px; color:var(--ink-faint); margin-top:22px;}
  .meaning-block{display:flex; flex-direction:column; gap:6px; align-items:center;}
  .pos-line{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; justify-content:center;}
  .pos-badge{font-size:11px; font-weight:700; color:var(--gold-deep); background:#F3E7CE; padding:2px 7px; border-radius:5px;}
  .pos-def{font-size:15px; color:var(--ink); font-family:'Noto Serif KR'; font-weight:500;}
  .spell-meaning{font-size:16px; font-family:'Noto Serif KR'; font-weight:700; color:var(--ink); margin-bottom:22px; line-height:1.6; max-width:320px;}
  .spell-input-wrap{width:100%; display:flex; flex-direction:column; align-items:center; gap:10px;}
  .spell-input{
    width:100%; max-width:280px; text-align:center; font-family:'Noto Serif KR';
    font-size:20px; font-weight:700; padding:11px 10px; border-radius:9px;
    border:2px solid var(--paper-line); background:#fff; color:var(--ink); outline:none;
  }
  .spell-input:focus{border-color:var(--gold);}
  .spell-input.correct{border-color:var(--green); background:var(--green-bg); color:var(--green);}
  .spell-input.wrong{border-color:var(--red); background:var(--red-bg); color:var(--red);}
  .spell-feedback{font-size:13px; font-weight:700; min-height:18px;}
  .spell-feedback.correct{color:var(--green);}
  .spell-feedback.wrong{color:var(--red);}
  .spell-actions{display:flex; gap:8px; margin-top:2px;}
  .nav-row{display:flex; align-items:center; justify-content:center;}

  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

  /* ---- Floating add-word button ---- */
  .fab-add{
    position:fixed; right:20px; bottom:24px; width:56px; height:56px; border-radius:50%;
    background:var(--ink); color:var(--card); border:none; font-size:28px; line-height:1;
    box-shadow:0 6px 18px -4px rgba(42,46,58,.45); cursor:pointer; z-index:45;
    display:none; align-items:center; justify-content:center; padding:0 0 2px;
  }
  .fab-add:active{ transform:scale(0.94); }
  .fab-panel{
    position:fixed; right:20px; bottom:90px; width:min(300px, calc(100vw - 40px));
    background:var(--card); border-radius:12px; box-shadow:0 12px 28px -10px rgba(42,46,58,.4);
    padding:12px; z-index:46; display:none; border:1px solid var(--paper-line);
  }
  .fab-panel.open{ display:block; }
  .fab-panel input{
    width:100%; border:1.5px solid var(--paper-line); border-radius:8px; padding:10px 12px;
    font-family:'Noto Serif KR'; font-size:16px; outline:none; background:#fff; color:var(--ink);
  }
  .fab-panel input:focus{ border-color:var(--gold); }

  @media (max-width:600px){
    body{ padding:16px 10px 40px; }
    h1{ font-size:21px; }
    .eyebrow{ font-size:10px; }
    .voca-table thead th.col-word, td.col-word{ width:auto; }
    .word-text{ max-width:84px; font-size:16px; }
    .voca-table tbody td{ padding:9px 8px; font-size:13px; }
    .meaning-text{ font-size:16px; }
    /* Bigger tap targets — 24px icons are too small to hit reliably on touch */
    .row-icon{ width:32px; height:32px; }
    .row-icon svg{ width:17px; height:17px; }
    .page-tab{ padding:10px 12px 9px; font-size:12.5px; }
    .icon-btn{ width:34px; height:34px; }
    .add-row input{ font-size:16px; padding:11px 12px; } /* 16px prevents iOS auto-zoom on focus */
    .btn{ padding:11px 16px; }
    .learn-overlay{ padding:18px 12px 32px; }
    .word{ font-size:26px; }
    .card{ padding:26px 18px 22px; min-height:280px; }
  }
</style>
</head>
<body>

<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <h2 id="authTitle">로그인</h2>
    <p class="sub" id="authSub">계정으로 로그인하면 여러 기기에서 단어장이 동기화돼요.</p>
    <div class="auth-field">
      <label>이메일</label>
      <input type="email" id="authEmail" autocomplete="email" placeholder="you@example.com">
    </div>
    <div class="auth-field">
      <label>비밀번호</label>
      <input type="password" id="authPassword" autocomplete="current-password" placeholder="6자 이상">
    </div>
    <div class="auth-error" id="authError">&nbsp;</div>
    <div class="auth-actions">
      <button class="btn btn-primary" id="authSubmitBtn">로그인</button>
    </div>
    <div class="auth-toggle">
      <span id="authToggleText">계정이 없으신가요?</span>
      <button class="link-btn" id="authToggleBtn">회원가입</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="eyebrow">MY VOCABULARY NOTEBOOK</div>
  <h1>나의 <span>단어장</span></h1>
  <div class="account-row">
    <span class="email" id="accountEmail"></span>
    <div style="display:flex; gap:12px;">
      <button class="link-btn" id="backfillAudioBtn">발음 채우기</button>
      <button class="link-btn" id="logoutBtn">로그아웃</button>
    </div>
  </div>
  <div class="sync-status" id="syncStatus">&nbsp;</div>

  <div class="page-tabs" id="pageTabs"></div>
  <div class="sheet" id="sheet"></div>
</div>

<!-- Learn overlay: memorize / spell modes, favorites only -->
<div class="learn-overlay" id="learnOverlay">
  <div class="learn-wrap">
    <div class="learn-top">
      <div class="eyebrow" id="learnTitle" style="margin:0;">★ 즐겨찾기 학습</div>
      <button class="learn-close" id="learnCloseBtn">✕</button>
    </div>
    <div class="modes" id="modeTabs"></div>
    <div class="progress-row">
      <span id="progLabel">1 / 1</span>
      <div class="progress-track"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
      <span id="audioDebug" style="font-size:10.5px;">&nbsp;</span>
    </div>
    <div class="stage" id="stage"></div>
    <div class="nav-row" id="navRow"></div>
  </div>
</div>

<!-- Floating "add word" button — lets you add a word from anywhere without
     scrolling down to a bottom input. Hidden on the favorites view. -->
<button class="fab-add" id="fabAddBtn" title="새 단어 추가" aria-label="새 단어 추가">+</button>
<div class="fab-panel" id="fabPanel">
  <input type="text" id="fabWordInput" placeholder="새 단어 입력 후 Enter" autocomplete="off" autocapitalize="off" spellcheck="false">
</div>

<script>
/* ================= Supabase ================= */
const SUPABASE_URL = 'https://bzfrxjoujcchzlzhumkf.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_n9iMbgNCYtEWOoTOUoJJOw_QNuOxaYo';
const REFRESH_KEY = 'wordbook_refresh_token';

let session = null;
let authMode = 'login';

function authHeaders(extra){
  const h = { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' };
  if(session && session.access_token) h['Authorization'] = 'Bearer ' + session.access_token;
  return Object.assign(h, extra||{});
}

async function supabaseAuthRequest(path, body){
  const res = await fetch(SUPABASE_URL + '/auth/v1' + path, {
    method: 'POST',
    headers: { apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error_description || data.msg || data.error || '요청에 실패했어요');
  return data;
}

async function signUp(email, password){
  const data = await supabaseAuthRequest('/signup', { email, password });
  if(data.access_token) setSession(data);
  else throw new Error('가입 확인 이메일을 보냈어요. 메일함을 확인한 뒤 로그인해주세요.');
}
async function signIn(email, password){
  const data = await supabaseAuthRequest('/token?grant_type=password', { email, password });
  setSession(data);
}
async function trySilentLogin(){
  let refreshToken = null;
  try{ refreshToken = localStorage.getItem(REFRESH_KEY); }catch(e){}
  if(!refreshToken) return false;
  try{
    const data = await supabaseAuthRequest('/token?grant_type=refresh_token', { refresh_token: refreshToken });
    setSession(data);
    return true;
  }catch(e){ return false; }
}
function setSession(data){
  session = { access_token: data.access_token, refresh_token: data.refresh_token, user: data.user };
  try{ localStorage.setItem(REFRESH_KEY, data.refresh_token); }catch(e){}
}
async function signOut(){
  try{ await fetch(SUPABASE_URL + '/auth/v1/logout', { method:'POST', headers: authHeaders() }); }catch(e){}
  session = null;
  try{ localStorage.removeItem(REFRESH_KEY); }catch(e){}
  showAuthOverlay();
}

/* ================= App state ================= */
let pages = [];              // [{id,name,position}]
let currentPageId = null;    // null while loading, 'favorites'/'review' for special views
let wordsByPage = {};        // pageId -> [word rows]
let favWords = [];           // cached favorites (with page name)
let reviewWords = [];        // cached "unfavorited 10+ days ago" review list (with page name)
let searchQuery = '';        // current search filter text, lowercased

function setSyncStatus(text, isErr){
  const el = document.getElementById('syncStatus');
  el.textContent = text || '\u00A0';
  el.classList.toggle('error', !!isErr);
}

/* ---- Pages ---- */
async function loadPages(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/pages?user_id=eq.${session.user.id}&select=*&order=position.asc`, { headers: authHeaders() });
  if(!res.ok){ setSyncStatus('페이지를 불러오지 못했어요 — pages 테이블을 확인해주세요', true); return; }
  pages = await res.json();
  if(pages.length === 0){
    await addPage('1페이지', true);
  } else {
    currentPageId = pages[0].id;
  }
}

async function addPage(name, silent){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/pages`, {
    method:'POST', headers: authHeaders({ Prefer:'return=representation' }),
    body: JSON.stringify({ user_id: session.user.id, name: name, position: pages.length })
  });
  if(!res.ok){ setSyncStatus('페이지 생성에 실패했어요', true); return; }
  const data = await res.json();
  pages.push(data[0]);
  currentPageId = data[0].id;
  if(!silent){ await renderAll(); }
}

async function renamePage(id, name){
  await fetch(`${SUPABASE_URL}/rest/v1/pages?id=eq.${id}`, {
    method:'PATCH', headers: authHeaders(), body: JSON.stringify({ name })
  });
  const p = pages.find(p=>p.id===id); if(p) p.name = name;
}

async function deletePage(id){
  if(pages.length <= 1){ alert('마지막 남은 페이지는 삭제할 수 없어요.'); return; }
  if(!confirm('이 페이지와 안의 단어를 모두 삭제할까요?')) return;
  await fetch(`${SUPABASE_URL}/rest/v1/pages?id=eq.${id}`, { method:'DELETE', headers: authHeaders() });
  pages = pages.filter(p=>p.id!==id);
  delete wordsByPage[id];
  if(currentPageId === id) currentPageId = pages[0].id;
  await renderAll();
}

/* ---- Words ---- */
async function loadWords(pageId){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/words?page_id=eq.${pageId}&select=*&order=position.asc`, { headers: authHeaders() });
  if(!res.ok){ setSyncStatus('단어를 불러오지 못했어요 — words 테이블을 확인해주세요', true); wordsByPage[pageId] = []; return; }
  wordsByPage[pageId] = await res.json();
}

async function loadFavorites(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/words?user_id=eq.${session.user.id}&is_favorite=eq.true&select=*,pages(name)&order=created_at.desc`, { headers: authHeaders() });
  if(!res.ok){ setSyncStatus('즐겨찾기를 불러오지 못했어요', true); favWords = []; return; }
  favWords = await res.json();
}

// "복습" list: words that were favorited at some point, then unfavorited,
// and it's now been 10+ days since that unfavoriting. No background job
// needed — this is just a time filter applied whenever the tab is opened.
const REVIEW_DELAY_DAYS = 10;
async function loadReviewWords(){
  const cutoff = new Date(Date.now() - REVIEW_DELAY_DAYS * 24 * 60 * 60 * 1000).toISOString();
  const url = `${SUPABASE_URL}/rest/v1/words?user_id=eq.${session.user.id}&is_favorite=eq.false&unfavorited_at=not.is.null&unfavorited_at=lte.${encodeURIComponent(cutoff)}&select=*,pages(name)&order=unfavorited_at.asc`;
  const res = await fetch(url, { headers: authHeaders() });
  if(!res.ok){ setSyncStatus('복습 목록을 불러오지 못했어요', true); reviewWords = []; return; }
  reviewWords = await res.json();
}

async function insertWord(pageId, word){
  const list = wordsByPage[pageId] || [];
  const res = await fetch(`${SUPABASE_URL}/rest/v1/words`, {
    method:'POST', headers: authHeaders({ Prefer:'return=representation' }),
    body: JSON.stringify({ user_id: session.user.id, page_id: pageId, word: word, meaning:'', is_favorite:false, position: list.length })
  });
  if(!res.ok){ setSyncStatus('단어 추가에 실패했어요', true); return null; }
  const data = await res.json();
  const row = data[0];
  list.push(row);
  wordsByPage[pageId] = list;
  return row;
}

// Shared by both the floating "+" button panel and (if present) any inline
// add field: inserts the word, then re-renders only if we're still looking
// at the page it was added to, then fetches/fills the definition.
async function submitNewWord(pageId, word){
  const wasEmpty = (wordsByPage[pageId] || []).length === 0;
  const row = await insertWord(pageId, word);
  if(pageId === currentPageId){
    if(wasEmpty) renderPageSheet(); else renderWordRows();
  }
  renderPageTabs();
  if(row){
    const { meaning, correctedWord, audioUrl } = await fetchDefinition(word);
    row.meaning = meaning || '';
    row.audio_url = audioUrl || null;
    const patch = { meaning: row.meaning, audio_url: row.audio_url };
    // If Naver's closest-match headword differs from what was typed (typo),
    // silently correct the stored word too — e.g. "appla" -> "apple".
    if(correctedWord && correctedWord.toLowerCase() !== word.toLowerCase()){
      row.word = correctedWord;
      patch.word = row.word;
    }
    await patchWord(row.id, patch);
    if(pageId === currentPageId) renderWordRows();
  }
  return row;
}

async function patchWord(id, fields){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/words?id=eq.${id}`, {
      method:'PATCH', headers: authHeaders(), body: JSON.stringify(fields)
    });
    if(!res.ok){
      const body = await res.json().catch(()=>({}));
      console.error('patchWord failed', res.status, body);
      setSyncStatus(`저장 실패 (${res.status}) — ${body.message || 'words 테이블 정책을 확인해주세요'}`, true);
      return false;
    }
    return true;
  }catch(e){
    console.error('patchWord network error', e);
    setSyncStatus('저장 실패 — 네트워크 오류', true);
    return false;
  }
}

async function deleteWord(pageId, id){
  await fetch(`${SUPABASE_URL}/rest/v1/words?id=eq.${id}`, { method:'DELETE', headers: authHeaders() });
  wordsByPage[pageId] = (wordsByPage[pageId]||[]).filter(w=>w.id!==id);
}

async function toggleFavorite(row, pageId){
  const prev = row.is_favorite;
  const prevUnfav = row.unfavorited_at;
  row.is_favorite = !row.is_favorite;
  // Track when a word gets unfavorited so the "복습" tab can later find
  // words that have sat unfavorited for 10+ days. Re-favoriting clears it.
  row.unfavorited_at = row.is_favorite ? null : new Date().toISOString();
  const ok = await patchWord(row.id, { is_favorite: row.is_favorite, unfavorited_at: row.unfavorited_at });
  if(!ok){ row.is_favorite = prev; row.unfavorited_at = prevUnfav; } // revert on failure so the star doesn't lie about saved state
  return ok;
}

async function favoriteAllInPage(pageId){
  const list = wordsByPage[pageId] || [];
  const toFavorite = list.filter(r => !r.is_favorite);
  if(toFavorite.length === 0){ alert('이 페이지의 단어는 이미 모두 즐겨찾기되어 있어요.'); return; }
  if(!confirm(`이 페이지의 단어 ${toFavorite.length}개를 모두 즐겨찾기에 추가할까요?`)) return;
  await Promise.all(toFavorite.map(row => toggleFavorite(row, pageId)));
  if(pageId === currentPageId) renderWordRows();
}

/* ---- Oxford dictionary lookup (via serverless proxy, see /api/dictionary.js) ---- */
async function fetchDefinition(word){
  try{
    const res = await fetch('/api/dictionary?word=' + encodeURIComponent(word));
    if(!res.ok) return { meaning: null, correctedWord: null, audioUrl: null };
    const data = await res.json();
    // proxy formats meaning to "n. ... \n v. ..." lines, returns correctedWord
    // when Naver's closest-match headword differs from what was typed (e.g.
    // "appla" -> "apple"), and audioUrl for a real native-speaker recording
    // when Naver has one for this entry.
    return { meaning: data.meaning || null, correctedWord: data.correctedWord || null, audioUrl: data.audioUrl || null };
  }catch(e){
    console.error('dictionary lookup failed', e);
    return { meaning: null, correctedWord: null, audioUrl: null };
  }
}

function parseMeaning(meaning){
  if(!meaning) return [{pos:'', def:''}];
  const lines = meaning.split('\n').filter(Boolean);
  return lines.map(line=>{
    const m = line.match(/^([a-z.]{1,6})\s+(.*)$/i);
    if(m) return { pos: m[1].replace(/\.$/,''), def: m[2] };
    return { pos:'', def: line };
  });
}

/* ================= TTS (native pronunciation -> Google TTS -> device speech) ================= */
const audioElCache = {};
let currentAudio = null;
function googleTtsUrl(word){ return 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=' + encodeURIComponent(word); }
let voices = [];
function loadVoices(){ voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; }
if(window.speechSynthesis){ loadVoices(); window.speechSynthesis.onvoiceschanged = loadVoices; }
function speakTTS(word){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US';
  const enVoice = voices.find(v => /en-US/i.test(v.lang)) || voices.find(v => v.lang && v.lang.startsWith('en'));
  if(enVoice) u.voice = enVoice;
  u.rate = 0.92;
  window.speechSynthesis.speak(u);
}
function prepareAudioFromSrc(key, src){
  if(audioElCache[key]) return audioElCache[key];
  const audio = new Audio();
  audio.preload = 'auto';
  audio.src = src;
  audio.addEventListener('error', ()=>{ audio.dataset.failed = '1'; });
  audio.load();
  audioElCache[key] = audio;
  return audio;
}
// Ordered fallback chain: real native-speaker recording from Naver (if we
// have one saved for this word) first, then Google's free TTS endpoint.
// Native browser speech synthesis is the last resort if both audio sources
// fail to load/play (e.g. Naver's file is hotlink-protected).
function audioSourcesFor(word, audioUrl){
  const sources = [];
  if(audioUrl) sources.push({ key: audioUrl, src: audioUrl });
  sources.push({ key: 'gtts:' + word, src: googleTtsUrl(word) });
  return sources;
}
function prepareAudio(word, audioUrl){
  // Kept for prefetching: warms the cache for the best available source
  // without actually playing it.
  const sources = audioSourcesFor(word, audioUrl);
  return prepareAudioFromSrc(sources[0].key, sources[0].src);
}
function playSourceChain(sources, idx, word, btn){
  if(idx >= sources.length){
    if(btn) btn.classList.remove('loading');
    speakTTS(word);
    return;
  }
  const { key, src } = sources[idx];
  const audio = prepareAudioFromSrc(key, src);
  currentAudio = audio;
  if(audio.dataset.failed === '1'){ playSourceChain(sources, idx + 1, word, btn); return; }
  if(btn) btn.classList.add('loading');
  audio.currentTime = 0;
  audio.play().then(()=>{ if(btn) btn.classList.remove('loading'); })
    .catch(()=>{ playSourceChain(sources, idx + 1, word, btn); });
}
function speak(word, btn, audioUrl){
  if(currentAudio) currentAudio.pause();
  playSourceChain(audioSourcesFor(word, audioUrl), 0, word, btn);
}

/* ================= Rendering: page tabs + sheet ================= */
async function renderAll(){
  searchQuery = '';
  renderPageTabs();
  if(currentPageId === 'favorites'){
    await loadFavorites();
    renderFavSheet();
  } else if(currentPageId === 'review'){
    await loadReviewWords();
    renderReviewSheet();
  } else {
    if(!wordsByPage[currentPageId]) await loadWords(currentPageId);
    renderPageSheet();
  }
}

function renderPageTabs(){
  const el = document.getElementById('pageTabs');
  el.innerHTML = pages.map(p => `
    <div class="page-tab ${currentPageId===p.id?'active':''}" data-id="${p.id}">${escapeHtml(p.name)}<span class="cnt">${(wordsByPage[p.id]||[]).length || ''}</span></div>
  `).join('') + `
    <div class="page-tab fav-tab ${currentPageId==='favorites'?'active':''}" data-id="favorites">★ 즐겨찾기</div>
    <div class="page-tab review-tab ${currentPageId==='review'?'active':''}" data-id="review">🔁 복습</div>
    <button class="page-tab-add" id="addPageBtn" title="새 페이지">+</button>
  `;
  el.querySelectorAll('.page-tab').forEach(tab=>{
    tab.addEventListener('click', async ()=>{
      currentPageId = tab.dataset.id;
      await renderAll();
    });
  });
  document.getElementById('addPageBtn').addEventListener('click', async ()=>{
    const name = prompt('새 페이지 이름을 입력하세요', `${pages.length+1}페이지`);
    if(name) await addPage(name);
  });
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderPageSheet(){
  const scrollY = window.scrollY;
  const page = pages.find(p=>p.id===currentPageId);
  const list = wordsByPage[currentPageId] || [];
  const el = document.getElementById('sheet');
  el.innerHTML = `
    <div class="sheet-toolbar">
      <input class="title-edit" id="pageTitleInput" value="${escapeHtml(page.name)}">
      <div class="toolbar-btns">
        ${list.length ? `<button class="icon-btn" id="favAllBtn" title="페이지 전체 즐겨찾기">${starIcon(false)}</button>` : ''}
        <button class="icon-btn danger" id="deletePageBtn" title="페이지 삭제">${trashIcon}</button>
      </div>
    </div>
    ${list.length===0 ? `
      <div class="empty-state"><h3>아직 단어가 없어요</h3><p>오른쪽 아래 + 버튼을 눌러 영어 단어를 추가해보세요.</p></div>
    ` : `
    <div class="search-row"><input type="text" id="searchInput" placeholder="🔍 단어·뜻 검색" value="${escapeHtml(searchQuery)}"></div>
    <table class="voca-table">
      <thead><tr><th class="col-word">단어</th><th>뜻</th></tr></thead>
      <tbody id="wordRows"></tbody>
    </table>
    <div class="study-cta"><button class="btn btn-primary" id="pageStudyBtn">이 페이지 학습하기</button></div>
    `}
  `;
  document.getElementById('pageTitleInput').addEventListener('change', (e)=> renamePage(page.id, e.target.value.trim() || page.name));
  document.getElementById('deletePageBtn').addEventListener('click', ()=> deletePage(page.id));
  const favAllBtn = document.getElementById('favAllBtn');
  if(favAllBtn) favAllBtn.addEventListener('click', ()=> favoriteAllInPage(currentPageId));
  const searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.addEventListener('input', (e)=>{ searchQuery = e.target.value.toLowerCase(); renderWordRows(); });
  }
  const studyBtn = document.getElementById('pageStudyBtn');
  if(studyBtn) studyBtn.addEventListener('click', ()=> openLearnOverlay('page', wordsByPage[currentPageId], currentPageId));
  if(list.length) renderWordRows();
  showFab();
  requestAnimationFrame(()=> window.scrollTo(0, scrollY));
}

function renderWordRows(){
  const tbody = document.getElementById('wordRows');
  if(!tbody) return;
  const scrollY = window.scrollY;
  const list = wordsByPage[currentPageId] || [];
  const filteredList = searchQuery
    ? list.filter(r => r.word.toLowerCase().includes(searchQuery) || (r.meaning||'').toLowerCase().includes(searchQuery))
    : list;
  tbody.innerHTML = filteredList.length ? filteredList.map(row => `
    <tr data-id="${row.id}">
      <td class="col-word">
        <div class="word-cell">
          <input class="word-text" value="${escapeHtml(row.word)}" data-role="word">
          <button class="row-icon speak" data-role="speak" title="발음 듣기">${speakerIcon}</button>
          <button class="row-icon star ${row.is_favorite?'active':''}" data-role="star" title="즐겨찾기">${starIcon(row.is_favorite)}</button>
        </div>
      </td>
      <td class="meaning-cell">
        <textarea class="meaning-text ${row.meaning===''?'':''}" data-role="meaning" rows="1" placeholder="뜻을 찾을 수 없어요 — 직접 입력해주세요">${escapeHtml(row.meaning||'')}</textarea>
      </td>
      <td style="width:30px; text-align:right;">
        <button class="row-icon del-btn" data-role="delete" title="삭제">${trashIcon}</button>
      </td>
    </tr>
  `).join('') : `<tr><td colspan="2" style="padding:20px 14px; color:var(--ink-faint); font-size:13px;">"${escapeHtml(searchQuery)}"와 일치하는 단어가 없어요</td></tr>`;

  tbody.querySelectorAll('tr').forEach(tr=>{
    const id = tr.dataset.id;
    const row = list.find(r=>r.id===id);
    const wordInput = tr.querySelector('[data-role="word"]');
    const meaningInput = tr.querySelector('[data-role="meaning"]');
    autoGrow(meaningInput);
    fitWordText(wordInput);
    meaningInput.addEventListener('input', ()=> autoGrow(meaningInput));
    wordInput.addEventListener('input', ()=> fitWordText(wordInput));
    wordInput.addEventListener('change', ()=>{ row.word = wordInput.value.trim(); patchWord(id, { word: row.word }); });
    meaningInput.addEventListener('change', ()=>{ row.meaning = meaningInput.value; patchWord(id, { meaning: row.meaning }); });
    tr.querySelector('[data-role="speak"]').addEventListener('click', (e)=> speak(row.word, e.currentTarget, row.audio_url));
    tr.querySelector('[data-role="star"]').addEventListener('click', async ()=>{
      // Re-render the whole row from data after the save completes, rather
      // than patching the clicked button's DOM node directly — this avoids
      // any edge case where the button reference goes stale during the
      // await and the visible icon silently fails to update.
      await toggleFavorite(row, currentPageId);
      renderWordRows();
    });
    tr.querySelector('[data-role="delete"]').addEventListener('click', async ()=>{
      if(!confirm(`"${row.word}" 단어를 삭제할까요?`)) return;
      await deleteWord(currentPageId, id);
      renderWordRows();
      renderPageTabs();
    });
  });
  requestAnimationFrame(()=> window.scrollTo(0, scrollY));
}

function autoGrow(ta){ ta.style.height='auto'; ta.style.height = ta.scrollHeight + 'px'; }

// Shrinks a word's font-size just enough to fit inside its fixed-width box
// (like iOS Contacts auto-shrinking a long name), instead of clipping it or
// growing the column. Works on both the editable <input> (page view) and
// the plain <span> (favorites/review views) since both use scrollWidth vs
// clientWidth to detect overflow.
const WORD_FIT_MIN_PX = 10;
function fitWordText(el){
  if(!el) return;
  el.style.fontSize = ''; // reset to the CSS-defined base size first
  let size = parseFloat(getComputedStyle(el).fontSize);
  // scrollWidth only reflects overflow once white-space:nowrap + overflow:hidden
  // are in effect, which .word-text already sets for the input; for the plain
  // span we rely on the same CSS class.
  let guard = 0;
  while(el.scrollWidth > el.clientWidth && size > WORD_FIT_MIN_PX && guard < 40){
    size -= 0.5;
    el.style.fontSize = size + 'px';
    guard++;
  }
}
function fitAllWordText(){
  document.querySelectorAll('.word-text').forEach(fitWordText);
}
let _wordFitResizeTimer = null;
window.addEventListener('resize', ()=>{
  clearTimeout(_wordFitResizeTimer);
  _wordFitResizeTimer = setTimeout(fitAllWordText, 150);
});


function renderFavSheet(){
  const el = document.getElementById('sheet');
  hideFab();
  if(favWords.length === 0){
    el.innerHTML = `
      <div class="sheet-toolbar"><div class="title-edit" style="color:var(--ink)">★ 즐겨찾기</div></div>
      <div class="empty-state"><h3>즐겨찾기한 단어가 없어요</h3><p>단어 옆 ★ 아이콘을 눌러 즐겨찾기에 추가해보세요.</p></div>
    `;
    return;
  }
  el.innerHTML = `
    <div class="sheet-toolbar"><div class="title-edit" style="color:var(--ink)">★ 즐겨찾기 (${favWords.length})</div></div>
    <div class="search-row"><input type="text" id="searchInput" placeholder="🔍 단어·뜻 검색" value="${escapeHtml(searchQuery)}"></div>
    <table class="voca-table">
      <thead><tr><th class="col-word">단어</th><th>뜻</th></tr></thead>
      <tbody id="favRows"></tbody>
    </table>
    <div class="study-cta"><button class="btn btn-primary" id="studyBtn">★ 학습모드 시작</button></div>
  `;
  document.getElementById('searchInput').addEventListener('input', (e)=>{ searchQuery = e.target.value.toLowerCase(); renderFavRows(); });
  document.getElementById('studyBtn').addEventListener('click', ()=> openLearnOverlay('favorites', favWords));
  renderFavRows();
}

function renderFavRows(){
  const tbody = document.getElementById('favRows');
  if(!tbody) return;
  const filtered = searchQuery
    ? favWords.filter(r => r.word.toLowerCase().includes(searchQuery) || (r.meaning||'').toLowerCase().includes(searchQuery))
    : favWords;
  tbody.innerHTML = filtered.length ? filtered.map(row => `
    <tr data-id="${row.id}">
      <td class="col-word">
        <div class="word-cell">
          <span class="word-text" style="cursor:default;">${escapeHtml(row.word)}</span>
          <button class="row-icon speak" data-role="speak" title="발음 듣기">${speakerIcon}</button>
          <button class="row-icon star active" data-role="unstar" title="즐겨찾기 해제">${starIcon(true)}</button>
        </div>
        ${row.pages && row.pages.name ? `<div class="fav-page-badge">${escapeHtml(row.pages.name)}</div>` : ''}
      </td>
      <td class="meaning-cell"><div class="meaning-text">${escapeHtml(row.meaning||'')}</div></td>
    </tr>
  `).join('') : `<tr><td colspan="2" style="padding:20px 14px; color:var(--ink-faint); font-size:13px;">"${escapeHtml(searchQuery)}"와 일치하는 단어가 없어요</td></tr>`;
  tbody.querySelectorAll('.word-text').forEach(fitWordText);
  tbody.querySelectorAll('[data-role="speak"]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const tr = e.currentTarget.closest('tr');
      const row = favWords.find(r=>r.id===tr.dataset.id);
      speak(row.word, e.currentTarget, row.audio_url);
    });
  });
  tbody.querySelectorAll('[data-role="unstar"]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      const tr = e.currentTarget.closest('tr');
      const row = favWords.find(r=>r.id===tr.dataset.id);
      await toggleFavorite(row, row.page_id); // also stamps unfavorited_at for the 복습 tab
      favWords = favWords.filter(r=>r.id!==row.id);
      renderFavSheet();
      renderPageTabs();
    });
  });
}

/* ================= "복습" view: unfavorited 10+ days ago ================= */
function renderReviewSheet(){
  const el = document.getElementById('sheet');

  if(reviewWords.length === 0){

  tbody.querySelectorAll('.word-text').forEach(fitWordText);

    btn.addEventListener('click', (e)=>{

/* ================= Learn overlay: memorize / spell queue ================= */
// source: 'favorites' | 'page' | 'review' — controls what the ribbon does
// and what happens when a word is answered.
let learnState = {
  source: 'favorites',
  pageId: null,
  sourceList: [],
  studyMode: 'memorize', // memorize | spell
  flipped: false,
  spellStatus: null,     // null | correct | wrong | revealed
  queue: [],
  total: 0,
  lastAutoSpokenId: null, // avoids re-playing audio on every re-render of the same word
};

function normalizeSpell(s){ return s.toLowerCase().trim().replace(/[^a-z]/g,''); }
function shuffleArray(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function openLearnOverlay(source, list, pageId){
  if(!list || list.length === 0) return;
  learnState.source = source;
  learnState.pageId = pageId || null;
  learnState.sourceList = list;
  learnState.studyMode = 'memorize';
  buildLearnQueue();
  document.getElementById('learnOverlay').classList.add('open');
  renderLearn();
  prefetchLearnAudio();
}
function closeLearnOverlay(){ document.getElementById('learnOverlay').classList.remove('open'); }
document.getElementById('learnCloseBtn').addEventListener('click', closeLearnOverlay);

function buildLearnQueue(){
  learnState.queue = shuffleArray(learnState.sourceList);
  learnState.total = learnState.queue.length;
  learnState.flipped = false;
  learnState.spellStatus = null;
  learnState.lastAutoSpokenId = null;
}
function setLearnMode(m){
  learnState.studyMode = m;
  learnState.flipped = false;
  learnState.spellStatus = null;
  buildLearnQueue();
  renderLearn();
  prefetchLearnAudio();
}
function prefetchLearnAudio(){ learnState.queue.forEach(r => prepareAudio(r.word, r.audio_url)); }

function learnTitleText(){
  if(learnState.source === 'page'){
    const p = pages.find(p=>p.id===learnState.pageId);
    return `${p ? escapeHtml(p.name) : '페이지'} 학습`;
  }
  if(learnState.source === 'review') return '🔁 복습 학습';
  return '★ 즐겨찾기 학습';
}

function renderModeTabs(){
  const el = document.getElementById('modeTabs');
  const titleEl = document.getElementById('learnTitle');
  if(titleEl) titleEl.textContent = learnTitleText();
  const cnt = learnState.sourceList.length + '개';
  const modes = [ {id:'memorize', label:'암기 학습'}, {id:'spell', label:'스펠 학습'} ];
  el.innerHTML = modes.map(m => `
    <button class="mode-btn ${learnState.studyMode===m.id?'active':''}" data-id="${m.id}">${m.label}<span class="cnt" style="display:block;font-size:10.5px;color:var(--ink-faint);">${cnt}</span></button>
  `).join('');
  el.querySelectorAll('.mode-btn').forEach(b=> b.addEventListener('click', ()=> setLearnMode(b.dataset.id)));
}

function renderProgress(){
  const done = learnState.total - learnState.queue.length;
  document.getElementById('progLabel').textContent = `${Math.min(done+1, learnState.total)} / ${learnState.total}`;
  document.getElementById('progFill').style.width = (learnState.total? (done/learnState.total*100):0) + '%';
}

// Whether the ribbon shows "starred" for the current row, per source:
// favorites list is always-starred by definition; page study reflects the
// word's actual favorite state; review words don't show a ribbon at all.
function ribbonActiveFor(row){
  if(learnState.source === 'favorites') return true;
  if(learnState.source === 'page') return !!row.is_favorite;
  return false;
}
async function handleRibbonClick(row){
  if(learnState.source === 'favorites'){
    await unstarFromLearn(row);
  } else if(learnState.source === 'page'){
    // Just toggles favorite status — stays in the queue either way, unlike
    // the favorites-only study session where unstarring removes it.
    await toggleFavorite(row, learnState.pageId);
    renderStage();
  }
}

function renderStage(){
  const stage = document.getElementById('stage');
  document.getElementById('navRow').innerHTML = '';
  if(learnState.queue.length === 0){
    stage.innerHTML = `
      <div class="card" style="cursor:default;">
        <div style="font-size:38px; margin-bottom:8px;">🎉</div>
        <h3 style="font-family:'Noto Serif KR'; font-size:19px; margin:0 0 8px;">학습 완료!</h3>
        <p style="font-size:13px; color:var(--ink-soft); margin:0 0 22px;">단어 ${learnState.total}개를 모두 학습했어요.</p>
        <button class="btn btn-primary" id="restartBtn">다시 학습하기</button>
      </div>`;
    document.getElementById('restartBtn').addEventListener('click', ()=>{ buildLearnQueue(); renderLearn(); prefetchLearnAudio(); });
    renderProgress();
    return;
  }

  const row = learnState.queue[0];
  const showRibbon = learnState.source !== 'review';
  const ribbonActive = ribbonActiveFor(row);
  const ribbonHtml = showRibbon ? `<div class="ribbon ${ribbonActive?'starred':''}" id="ribbonBtn">${ribbonSvg(ribbonActive)}</div>` : '';
  const parts = parseMeaning(row.meaning);
  const posHtml = parts.map(p => `<span class="pos-line">${p.pos?`<span class="pos-badge">${escapeHtml(p.pos)}</span>`:''}<span class="pos-def">${escapeHtml(p.def)}</span></span>`).join('');

  if(learnState.studyMode === 'spell'){
    const status = learnState.spellStatus;
    const answered = status === 'correct' || status === 'wrong' || status === 'revealed';
    stage.innerHTML = `
      <div class="card" style="cursor:default;">
        ${ribbonHtml}
        <div class="spell-meaning">${posHtml}</div>
        <button class="speak-btn small" id="speakBtnHint" title="발음 듣기" style="margin:-14px 0 18px;">${speakerIcon}</button>
        <div class="spell-input-wrap">
          <input class="spell-input ${status==='correct'?'correct':(status==='wrong'||status==='revealed')?'wrong':''}"
                 id="spellInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
                 placeholder="영단어 스펠링 입력"
                 ${answered ? `value="${escapeHtml(row.word)}" readonly` : ''}>
          <div class="spell-feedback ${status==='correct'?'correct':(status==='wrong'||status==='revealed')?'wrong':''}">
            ${status==='correct' ? '정답이에요!' : status==='wrong' ? `오답이에요! 정답: ${escapeHtml(row.word)}` : status==='revealed' ? `정답: ${escapeHtml(row.word)}` : '\u00A0'}
          </div>
          <div class="spell-actions">
            ${answered
              ? `<button class="btn btn-primary" id="nextBtn">다음</button>`
              : `<button class="btn btn-primary" id="checkBtn">확인</button><button class="btn btn-ghost" id="revealBtn">정답 보기</button>`}
          </div>
        </div>
      </div>`;
    if(showRibbon) document.getElementById('ribbonBtn').addEventListener('click', (e)=>{ e.stopPropagation(); handleRibbonClick(row); });
    document.getElementById('speakBtnHint').addEventListener('click', (e)=> speak(row.word, e.currentTarget, row.audio_url));
    const input = document.getElementById('spellInput');
    if(!answered){
      input.focus();
      input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') checkSpell(input); });
      document.getElementById('checkBtn').addEventListener('click', ()=> checkSpell(input));
      document.getElementById('revealBtn').addEventListener('click', ()=>{ learnState.spellStatus='revealed'; renderStage(); });
    } else {
      const nextBtn = document.getElementById('nextBtn');
      nextBtn.addEventListener('click', proceedSpell);
    }
  } else {
    stage.innerHTML = `
      <div class="card" id="flipCard">
        ${ribbonHtml}
        ${!learnState.flipped ? `
          <div class="word-row"><div class="word">${escapeHtml(row.word)}</div><button class="speak-btn" id="speakBtn">${speakerIcon}</button></div>
          <div class="tap-cue">탭하면 뜻이 보여요</div>
        ` : `
          <div class="word-row"><div class="word" style="font-size:22px;">${escapeHtml(row.word)}</div><button class="speak-btn small" id="speakBtn">${speakerIcon}</button></div>
          <div class="meaning-block" style="margin:14px 0 22px;">${posHtml}</div>
          <div class="spell-actions">
            <button class="btn btn-ghost" id="unknownBtn">헷갈려요</button>
            <button class="btn btn-primary" id="knownBtn">외웠어요</button>
          </div>
        `}
      </div>`;
    document.getElementById('flipCard').addEventListener('click', (e)=>{
      if(e.target.closest('#ribbonBtn') || e.target.closest('#speakBtn') || e.target.closest('#knownBtn') || e.target.closest('#unknownBtn')) return;
      learnState.flipped = !learnState.flipped; renderStage();
    });
    if(showRibbon) document.getElementById('ribbonBtn').addEventListener('click', (e)=>{ e.stopPropagation(); handleRibbonClick(row); });
    document.getElementById('speakBtn').addEventListener('click', (e)=>{ e.stopPropagation(); speak(row.word, e.currentTarget, row.audio_url); });
    const knownBtn = document.getElementById('knownBtn'), unknownBtn = document.getElementById('unknownBtn');
    if(knownBtn) knownBtn.addEventListener('click', (e)=>{ e.stopPropagation(); handleKnown(row); });
    if(unknownBtn) unknownBtn.addEventListener('click', (e)=>{ e.stopPropagation(); handleUnknown(row); });

    // Auto-play pronunciation once per new word, only on the front (word) side
    // — not on every re-render (e.g. flipping back and forth, or toggling
    // the ribbon) so it doesn't replay annoyingly.
    if(!learnState.flipped && learnState.lastAutoSpokenId !== row.id){
      learnState.lastAutoSpokenId = row.id;
      speak(row.word, document.getElementById('speakBtn'), row.audio_url);
    }
  }
  renderProgress();
}

async function unstarFromLearn(row){
  row.is_favorite = false;
  row.unfavorited_at = new Date().toISOString();
  await patchWord(row.id, { is_favorite:false, unfavorited_at: row.unfavorited_at });
  learnState.queue = learnState.queue.filter(r=>r.id!==row.id);
  learnState.total = Math.max(0, learnState.total - 1);
  favWords = favWords.filter(r=>r.id!==row.id);
  learnState.flipped = false; learnState.spellStatus = null;
  renderStage();
}
async function handleKnown(row){
  if(learnState.source === 'review'){
    // Reviewed and remembered — done for good, drop off the review list.
    await patchWord(row.id, { unfavorited_at: null });
  }
  markKnown();
}
async function handleUnknown(row){
  if(learnState.source === 'review'){
    // Still don't know it — promote back to active favorites instead of
    // just cycling it within the review queue.
    row.is_favorite = true;
    row.unfavorited_at = null;
    await patchWord(row.id, { is_favorite:true, unfavorited_at:null });
    learnState.queue.shift();
    learnState.flipped = false;
    renderStage();
  } else {
    markUnknown();
  }
}
function markKnown(){ learnState.queue.shift(); learnState.flipped=false; renderStage(); }
function markUnknown(){ const e=learnState.queue.shift(); if(e) learnState.queue.push(e); learnState.flipped=false; renderStage(); }
function checkSpell(inputEl){
  const row = learnState.queue[0]; if(!row) return;
  learnState.spellStatus = normalizeSpell(inputEl.value)===normalizeSpell(row.word) ? 'correct' : 'wrong';
  renderStage();
}
async function proceedSpell(){
  const row = learnState.queue.shift();
  if(learnState.source === 'review'){
    if(row){
      if(learnState.spellStatus === 'correct'){
        await patchWord(row.id, { unfavorited_at: null });
      } else {
        row.is_favorite = true; row.unfavorited_at = null;
        await patchWord(row.id, { is_favorite:true, unfavorited_at:null });
      }
    }
  } else if(row && learnState.spellStatus !== 'correct'){
    learnState.queue.push(row);
  }
  learnState.spellStatus = null;
  renderStage();
}
function renderLearn(){ renderModeTabs(); renderStage(); }

/* ================= Auth wiring ================= */
function showAuthOverlay(){ document.getElementById('authOverlay').style.display = 'flex'; }
function hideAuthOverlay(){
  document.getElementById('authOverlay').style.display = 'none';
  // Clear these so a leftover filled password field (still in the DOM, just
  // hidden) doesn't make Chrome think every later Enter-press elsewhere on
  // the page is a login form being submitted.
  document.getElementById('authEmail').value = '';
  document.getElementById('authPassword').value = '';
}
function updateAccountRow(){ document.getElementById('accountEmail').textContent = session && session.user ? session.user.email : ''; }

function setAuthMode(mode){
  authMode = mode;
  document.getElementById('authError').textContent = '\u00A0';
  if(mode==='login'){
    document.getElementById('authTitle').textContent='로그인';
    document.getElementById('authSub').textContent='계정으로 로그인하면 여러 기기에서 단어장이 동기화돼요.';
    document.getElementById('authSubmitBtn').textContent='로그인';
    document.getElementById('authToggleText').textContent='계정이 없으신가요?';
    document.getElementById('authToggleBtn').textContent='회원가입';
  } else {
    document.getElementById('authTitle').textContent='회원가입';
    document.getElementById('authSub').textContent='이메일과 비밀번호로 새 계정을 만들어요.';
    document.getElementById('authSubmitBtn').textContent='회원가입';
    document.getElementById('authToggleText').textContent='이미 계정이 있으신가요?';
    document.getElementById('authToggleBtn').textContent='로그인';
  }
}
async function handleAuthSubmit(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const errEl = document.getElementById('authError');
  const btn = document.getElementById('authSubmitBtn');
  errEl.textContent = '\u00A0';
  if(!email || !password){ errEl.textContent = '이메일과 비밀번호를 입력해주세요.'; return; }
  btn.disabled = true;
  try{
    if(authMode==='login') await signIn(email, password); else await signUp(email, password);
    hideAuthOverlay(); updateAccountRow(); startApp();
  }catch(e){ errEl.textContent = e.message || '문제가 발생했어요. 다시 시도해주세요.'; }
  finally{ btn.disabled = false; }
}
document.getElementById('authSubmitBtn').addEventListener('click', handleAuthSubmit);
document.getElementById('authPassword').addEventListener('keydown', (e)=>{ if(e.key==='Enter') handleAuthSubmit(); });
document.getElementById('authToggleBtn').addEventListener('click', ()=> setAuthMode(authMode==='login'?'signup':'login'));
document.getElementById('logoutBtn').addEventListener('click', signOut);

// Backfills audio_url for every word in the whole notebook that doesn't
// have one yet — mainly for words added before native pronunciation
// support existed. Meaning is left untouched; only the audio source is
// re-looked-up. A small delay between requests is polite to Naver's
// (unofficial) endpoint given how many words this could touch.
async function backfillAudioUrls(){
  if(!confirm('전체 단어장에서 발음 주소가 없는 단어를 모두 찾아 다시 조회할까요? 단어 수가 많으면 시간이 걸릴 수 있어요.')) return;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/words?user_id=eq.${session.user.id}&audio_url=is.null&select=id,word,page_id`, { headers: authHeaders() });
  if(!res.ok){ setSyncStatus('일괄 업데이트 대상 조회 실패', true); return; }
  const targets = await res.json();
  if(targets.length === 0){ alert('발음 주소가 없는 단어가 없어요. 이미 다 채워져 있어요.'); return; }

  const btn = document.getElementById('backfillAudioBtn');
  if(btn) btn.disabled = true;
  let done = 0, filled = 0;
  for(const t of targets){
    setSyncStatus(`발음 채우는 중… (${done}/${targets.length})`);
    try{
      const { audioUrl } = await fetchDefinition(t.word);
      if(audioUrl){
        await patchWord(t.id, { audio_url: audioUrl });
        filled++;
        // Keep in-memory caches in sync so already-loaded rows update
        // immediately without needing a page reload.
        const cached = (wordsByPage[t.page_id] || []).find(r => r.id === t.id);
        if(cached) cached.audio_url = audioUrl;
        const favCached = favWords.find(r => r.id === t.id);
        if(favCached) favCached.audio_url = audioUrl;
        const reviewCached = reviewWords.find(r => r.id === t.id);
        if(reviewCached) reviewCached.audio_url = audioUrl;
      }
    }catch(e){
      console.error('audio backfill failed for', t.word, e);
    }
    done++;
    await new Promise(r => setTimeout(r, 150));
  }
  if(btn) btn.disabled = false;
  setSyncStatus('');
  alert(`완료! ${targets.length}개 중 ${filled}개 단어에 발음을 채웠어요.`);

  if(currentPageId === 'favorites') renderFavRows();
  else if(currentPageId === 'review') renderReviewRows();
  else renderWordRows();
}
document.getElementById('backfillAudioBtn').addEventListener('click', backfillAudioUrls);

async function startApp(){
  setSyncStatus('불러오는 중...');
  await loadPages();
  await renderAll();
  setSyncStatus('');
}

/* ================= Floating add-word button ================= */
function showFab(){ document.getElementById('fabAddBtn').style.display = 'flex'; }
function hideFab(){ document.getElementById('fabAddBtn').style.display = 'none'; closeFabPanel(); }
function openFabPanel(){
  document.getElementById('fabPanel').classList.add('open');
  document.getElementById('fabWordInput').focus();
}
function closeFabPanel(){
  document.getElementById('fabPanel').classList.remove('open');
  document.getElementById('fabWordInput').value = '';
}
document.getElementById('fabAddBtn').addEventListener('click', ()=>{
  const panel = document.getElementById('fabPanel');
  if(panel.classList.contains('open')) closeFabPanel(); else openFabPanel();
});
document.getElementById('fabWordInput').addEventListener('keydown', async (e)=>{
  if(e.key === 'Escape'){ closeFabPanel(); return; }
  if(e.key !== 'Enter') return;
  const input = e.target;
  const word = input.value.trim();
  if(!word) return;
  input.disabled = true;
  await submitNewWord(currentPageId, word);
  input.disabled = false;
  closeFabPanel();
});
// Click anywhere outside the panel/button to close it
document.addEventListener('click', (e)=>{
  const panel = document.getElementById('fabPanel');
  const btn = document.getElementById('fabAddBtn');
  if(!panel.classList.contains('open')) return;
  if(panel.contains(e.target) || btn.contains(e.target)) return;
  closeFabPanel();
});

  const ok = await trySilentLogin();
  if(ok){ hideAuthOverlay(); updateAccountRow(); startApp(); }

})();
